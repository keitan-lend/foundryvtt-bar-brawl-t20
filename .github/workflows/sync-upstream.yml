name: Sincronizar com o Bar Brawl original

# Roda automaticamente toda segunda-feira às 06:00 UTC e também pode ser
# disparado manualmente na aba "Actions" do GitHub, clicando em "Run workflow".
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Baixar o fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Adicionar o repositório original como "upstream"
        run: git remote add upstream https://gitlab.com/woodentavern/foundryvtt-bar-brawl.git

      - name: Buscar atualizações do original
        run: git fetch upstream

      - name: Tentar mesclar as atualizações
        id: merge
        continue-on-error: true
        run: git merge upstream/master --no-edit

      - name: Publicar as atualizações mescladas
        if: steps.merge.outcome == 'success'
        run: git push origin HEAD:main

      - name: Abrir issue avisando sobre conflito
        if: steps.merge.outcome == 'failure'
        run: git merge --abort

      - name: Criar issue de conflito
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Conflito ao sincronizar com o Bar Brawl original",
              body: [
                "A sincronização automática com o repositório original (GitLab) encontrou um conflito ",
                "e precisa ser resolvida manualmente, provavelmente porque o original alterou uma parte ",
                "do código que também foi customizada neste fork (api.js, rendering.js ou module.json).",
                "",
                "Para resolver no PowerShell, dentro da pasta do repositório:",
                "",
                "```powershell",
                "git fetch upstream",
                "git merge upstream/master",
                "# o git vai apontar os arquivos em conflito; abra-os, procure por <<<<<<<, ",
                "# ajuste o trecho manualmente e salve",
                "git add .",
                "git commit -m \"Resolve conflito da sincronizacao com upstream\"",
                "git push origin main",
                "```"
              ].join("\n")
            });
